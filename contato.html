<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Autoeletric</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container topo">
      <a class="marca" href="index.html">Auto<span>eletric</span></a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="veiculo.html">Veículos</a>
        <a href="acessorios.html">Acessórios</a>
        <a href="retirada.html">Retirada</a>
        <a href="regras.html">Regras</a>
        <a href="sobre.html">Sobre</a>
        <a class="ativo" href="contato.html">Contato</a>
        <a href="https://www.detran.pr.gov.br/Pagina/Legislacao" target="_blank">Detran-PR ↗</a>
        <a href="login.html">Entrar</a>
        <a href="carrinho.html">Carrinho (<span class="qtd-carrinho">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="secao container">
    <form class="card mx-auto" style="max-width: 460px;" onsubmit="enviarContato(event)">
      <h2>Fale conosco</h2>
      <div>
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" type="text" id="nome" placeholder="Seu nome" minlength="3" pattern="[A-Za-zÀ-ú ]+" required>
      </div>
      <div>
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" placeholder="nome@exemplo.com" required>
      </div>
      <div>
        <label class="form-label" for="assunto">Assunto</label>
        <select class="form-select" id="assunto" required>
          <option value="">Escolha um assunto</option>
          <option>Dúvida sobre produto</option>
          <option>Retirada na loja</option>
          <option>Outro assunto</option>
        </select>
      </div>
      <div>
        <label class="form-label" for="mensagem">Mensagem</label>
        <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem" minlength="10" required></textarea>
      </div>
      <button class="btn btn-success" type="submit">Enviar mensagem</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Autoeletric - Curitiba/PR</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
