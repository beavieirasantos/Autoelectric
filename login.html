  <main class="secao container">
    <form class="card mx-auto" style="max-width: 460px;" onsubmit="fazerLogin(event)">
      <h2>Entrar na conta</h2>
      <div>
        <label class="form-label" for="emailLogin">E-mail</label>
        <input class="form-control" type="email" id="emailLogin" placeholder="nome@exemplo.com" required>
      </div>
      <div>
        <label class="form-label" for="senhaLogin">Senha</label>
        <input class="form-control" type="password" id="senhaLogin" placeholder="Sua senha" required>
      </div>
      <button class="btn btn-success" type="submit">Entrar</button>
    </form>
  </main>
